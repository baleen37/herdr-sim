id = "baleen37.herdr-sim"
name = "herdr-sim"
version = "0.1.0"
# `agent list` must report `agent_session`, which the Claude and Codex
# integrations fill in from 0.9.0.
min_herdr_version = "0.9.0"
platforms = ["macos", "linux"]
description = "Show the PRs each Claude Code / Codex pane touched as sidebar icons."

# The binary is expected at $HERDR_PLUGIN_ROOT/bin/herdr-sim. The Nix package
# lays it out that way, so `herdr plugin link <package>` works as is.
[[startup]]
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/herdr-sim\""]

# A finished turn is when a session may have created or pushed to a PR.
[[events]]
on = "pane.agent_status_changed"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/herdr-sim\""]
