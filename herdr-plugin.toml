id = "baleen37.herdr-sim"
name = "herdr-sim"
version = "0.35.0"
# `agent list` must report `agent_session`, which the Claude and Codex
# integrations fill in from 0.9.0.
min_herdr_version = "0.9.0"
platforms = ["macos", "linux"]
description = "Show the PRs each Claude Code / Codex pane touched as sidebar icons."

# The binary is expected at $HERDR_PLUGIN_ROOT/bin/herdr-sim. On
# `herdr plugin install` the build step downloads it from the matching GitHub
# Release; the Nix package lays it out the same way for `herdr plugin link`.
[[build]]
command = ["sh", "herdr/install.sh"]

[[startup]]
command = ["sh", "-c", "exec \"${HERDR_SIM_BIN:-$HERDR_PLUGIN_ROOT/bin/herdr-sim}\""]

# Herdr disables its own Agents order toggle while a plugin's order is on, so
# the plugin owns the way back. Bind it with a `plugin_action` key command.
[[actions]]
id = "toggle-order"
title = "Agents: activity order on/off"
description = "Switch the Agents list between activity order and Herdr's own."
command = ["sh", "-c", "exec \"${HERDR_SIM_BIN:-$HERDR_PLUGIN_ROOT/bin/herdr-sim}\" --toggle-order"]

# A finished turn is when a session may have created or pushed to a PR.
[[events]]
on = "pane.agent_status_changed"
command = ["sh", "-c", "exec \"${HERDR_SIM_BIN:-$HERDR_PLUGIN_ROOT/bin/herdr-sim}\""]

# A new worktree workspace is a new branch row; show its PR right away.
[[events]]
on = "worktree.created"
command = ["sh", "-c", "exec \"${HERDR_SIM_BIN:-$HERDR_PLUGIN_ROOT/bin/herdr-sim}\""]

[[events]]
on = "worktree.opened"
command = ["sh", "-c", "exec \"${HERDR_SIM_BIN:-$HERDR_PLUGIN_ROOT/bin/herdr-sim}\""]

# An agent pane going away changes its Space's agent count.
[[events]]
on = "pane.closed"
command = ["sh", "-c", "exec \"${HERDR_SIM_BIN:-$HERDR_PLUGIN_ROOT/bin/herdr-sim}\""]

# Looking at a pane releases the tick its finished turn held.
[[events]]
on = "pane.focused"
command = ["sh", "-c", "exec \"${HERDR_SIM_BIN:-$HERDR_PLUGIN_ROOT/bin/herdr-sim}\""]

# A new Space needs its $project before its name can show.
[[events]]
on = "workspace.created"
command = ["sh", "-c", "exec \"${HERDR_SIM_BIN:-$HERDR_PLUGIN_ROOT/bin/herdr-sim}\""]

# Claude Code's "Changes" panel in a right-hand split: the PRs the focused
# agent's session touched. Bind the action to a key, e.g. cmd+p.
[[panes]]
id = "changes"
title = "Changes"
placement = "split"
command = ["sh", "-c", "exec \"${HERDR_SIM_BIN:-$HERDR_PLUGIN_ROOT/bin/herdr-sim}\" --changes-pane"]

# The diff the Changes panel opens with `d`, in its place on the right half
# of the tab.
[[panes]]
id = "diff"
title = "Diff"
placement = "split"
command = ["sh", "-c", "exec \"${HERDR_SIM_BIN:-$HERDR_PLUGIN_ROOT/bin/herdr-sim}\" --diff-pane"]

# `e` in the diff pane: the file in the user's editor, at the line, zoomed
# over the diff.
[[panes]]
id = "edit"
title = "Edit"
placement = "zoomed"
command = ["sh", "-c", "exec \"${HERDR_SIM_BIN:-$HERDR_PLUGIN_ROOT/bin/herdr-sim}\" --edit-pane"]

[[actions]]
id = "toggle-changes"
title = "Changes: open/close the right panel"
description = "Open or close the panel of PRs the focused agent's session touched."
command = ["sh", "-c", "exec \"${HERDR_SIM_BIN:-$HERDR_PLUGIN_ROOT/bin/herdr-sim}\" --toggle-changes"]

# Ctrl+click on a GitHub PR link in any pane: its diff, as `d` shows it.
[[actions]]
id = "pr-diff"
title = "Changes: the clicked PR's diff"
description = "Open the diff of a GitHub pull request link on the right half of the tab."
command = ["sh", "-c", "exec \"${HERDR_SIM_BIN:-$HERDR_PLUGIN_ROOT/bin/herdr-sim}\" --pr-diff"]

[[link_handlers]]
id = "github-pr"
title = "Show the PR's diff"
pattern = "^https://github\\.com/[^/]+/[^/]+/pull/[0-9]+"
action = "pr-diff"
