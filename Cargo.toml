[package]
name = "herdr-sim"
version = "0.13.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/baleen37/herdr-sim"
homepage = "https://github.com/baleen37/herdr-sim"
description = "Herdr plugin that shows the PRs each Claude Code / Codex pane touched as sidebar icons."

[lib]
name = "herdr_sim"

[[bin]]
name = "herdr-sim"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
serde_json = "1.0.149"

[dev-dependencies]
tempfile = "3.27.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
